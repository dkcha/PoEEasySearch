<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoE Trade URL Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .search-form {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            margin-bottom: 8px;
            font-weight: 600;
            color: #4ecdc4;
        }

        input, select {
            padding: 12px;
            border: 2px solid rgba(78, 205, 196, 0.3);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: #e0e0e0;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #4ecdc4;
            box-shadow: 0 0 10px rgba(78, 205, 196, 0.3);
        }

        .mod-search {
            display: flex;
            gap: 10px;
            align-items: end;
        }

        .mod-search input {
            flex: 1;
        }

        .btn {
            padding: 12px 24px;
            background: linear-gradient(45deg, #4ecdc4, #44a08d);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 16px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(78, 205, 196, 0.4);
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 14px;
        }

        .mod-list {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            max-height: 200px;
            overflow-y: auto;
        }

        .mod-item {
            display: flex;
            justify-content: between;
            align-items: center;
            padding: 8px;
            margin: 5px 0;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
        }

        .mod-item span {
            flex: 1;
        }

        .remove-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 12px;
        }

        .results {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
        }

        .trade-url {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 8px;
            word-break: break-all;
            font-family: monospace;
            border-left: 4px solid #4ecdc4;
        }

        .copy-btn {
            margin-top: 10px;
            background: #ff6b6b;
        }

        .checkbox-group {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .checkbox-group input[type="checkbox"] {
            width: auto;
            margin-right: 8px;
        }

        @media (max-width: 768px) {
            .search-form {
                grid-template-columns: 1fr;
            }
            
            .mod-search {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ PoE Trade URL Generator</h1>
        
        <div class="search-form">
            <div class="form-group">
                <label for="league">League</label>
                <select id="league">
                    <option value="Mercenaries">Mercenaries</option>
                    <option value="Standard">Standard</option>
                    <option value="Hardcore">Hardcore</option>
                </select>
            </div>

            <div class="form-group">
                <label for="base-item">Base Item</label>
                <input type="text" id="base-item" placeholder="e.g., Twilight Regalia, Murderous Eye Jewel" list="base-items-list">
                <datalist id="base-items-list"></datalist>
            </div>

            <div class="form-group">
                <label for="item-category">Item Category</label>
                <select id="item-category">
                    <option value="">Any</option>
                    <option value="weapon">Weapon</option>
                    <option value="armour">Armour</option>
                    <option value="accessory">Accessory</option>
                    <option value="jewel">Jewel</option>
                    <option value="flask">Flask</option>
                </select>
            </div>

            <div class="form-group">
                <label for="item-rarity">Item Rarity</label>
                <select id="item-rarity">
                    <option value="">Any</option>
                    <option value="normal">Normal</option>
                    <option value="magic">Magic</option>
                    <option value="rare">Rare</option>
                    <option value="unique">Unique</option>
                </select>
            </div>

            <div class="form-group">
                <label for="quality">Quality</label>
                <div style="display: flex; gap: 5px;">
                    <input type="number" id="quality-min" min="0" max="30" placeholder="Min" style="width: 50%;">
                    <input type="number" id="quality-max" min="0" max="30" placeholder="Max" style="width: 50%;">
                </div>
            </div>

            <div class="form-group">
                <label for="item-level">Item Level</label>
                <div style="display: flex; gap: 5px;">
                    <input type="number" id="item-level-min" min="1" max="100" placeholder="Min" style="width: 50%;">
                    <input type="number" id="item-level-max" min="1" max="100" placeholder="Max" style="width: 50%;">
                </div>
            </div>

            <div class="form-group checkbox-group">
                <label>
                    <input type="checkbox" id="corrupted"> Corrupted
                </label>
                <label>
                    <input type="checkbox" id="fractured"> Fractured
                </label>
                <label>
                    <input type="checkbox" id="synthesised"> Synthesised
                </label>
                <label>
                    <input type="checkbox" id="crafted"> Crafted
                </label>
                <label>
                    <input type="checkbox" id="veiled"> Veiled
                </label>
                <label>
                    <input type="checkbox" id="mirrored"> Mirrored
                </label>
            </div>

            <div class="form-group full-width">
                <label>Stat Filters</label>
                <div class="mod-search">
                    <input type="text" id="mod-search" placeholder="Search for mods (e.g., maximum life, energy shield)" list="mod-suggestions">
                    <datalist id="mod-suggestions"></datalist>
                    <select id="mod-tier" style="width: 100px;">
                        <option value="">Any Tier</option>
                        <option value="T1">T1 (Best)</option>
                        <option value="T2">T2</option>
                        <option value="T3">T3</option>
                        <option value="T4">T4</option>
                        <option value="T5">T5</option>
                        <option value="T6">T6+</option>
                    </select>
                    <input type="number" id="mod-min" placeholder="Min" style="width: 80px;">
                    <input type="number" id="mod-max" placeholder="Max" style="width: 80px;">
                    <button class="btn btn-small" onclick="addMod()">Add Stat</button>
                </div>
                <div id="mod-list" class="mod-list" style="display: none;"></div>
            </div>
        </div>

        <button class="btn" onclick="generateTradeURL()" style="width: 100%; font-size: 18px;">
            🔗 Generate Trade URL
        </button>

        <div id="results" class="results" style="display: none;">
            <h3>Generated Trade URL:</h3>
            <div id="trade-url" class="trade-url"></div>
            <button class="btn copy-btn" onclick="copyToClipboard()">📋 Copy URL</button>
            <button class="btn" onclick="openInNewTab()" style="margin-left: 10px;">🚀 Open in PoE Trade</button>
        </div>
    </div>

    <script>
        // Enhanced data structures to work with your RePoE data
        let gameData = {
            baseItems: {},
            mods: {},
            modsByBase: {},
            tierMappings: {}
        };

        // Mock enhanced data - replace with your RePoE data
        const mockBaseItems = {
            "twilight-regalia": {
                name: "Twilight Regalia",
                display_name: "Twilight Regalia",
                item_class: "Body Armours",
                category: "armour.chest",
                tags: ["body_armour", "armour", "str_int_armour"],
                domain: "item"
            },
            "murderous-eye-jewel": {
                name: "Murderous Eye Jewel",
                display_name: "Murderous Eye Jewel", 
                item_class: "Abyss Jewels",
                category: "jewel.abyss",
                tags: ["abyss_jewel", "jewel"],
                domain: "abyss_jewel"
            }
        };

        const mockMods = {
            "maximum-life": {
                name: "maximum Life",
                text: "+(#-#) to maximum Life",
                domain: "item",
                generation_type: "prefix",
                group: "IncreasedLife",
                spawn_weights: [
                    { tag: "body_armour", weight: 1000 },
                    { tag: "jewel", weight: 1000 }
                ],
                tiers: {
                    "T1": { min: 90, max: 99, tier: 1 },
                    "T2": { min: 80, max: 89, tier: 2 },
                    "T3": { min: 70, max: 79, tier: 3 },
                    "T4": { min: 60, max: 69, tier: 4 },
                    "T5": { min: 50, max: 59, tier: 5 },
                    "T6": { min: 40, max: 49, tier: 6 }
                }
            },
            "energy-shield": {
                name: "maximum Energy Shield",
                text: "+(#-#) to maximum Energy Shield",
                domain: "item",
                generation_type: "prefix",
                group: "IncreasedEnergyShield",
                spawn_weights: [
                    { tag: "body_armour", weight: 1000 },
                    { tag: "str_int_armour", weight: 1000 }
                ],
                tiers: {
                    "T1": { min: 100, max: 109, tier: 1 },
                    "T2": { min: 90, max: 99, tier: 2 },
                    "T3": { min: 80, max: 89, tier: 3 },
                    "T4": { min: 70, max: 79, tier: 4 },
                    "T5": { min: 60, max: 69, tier: 5 }
                }
            }
        };

        // Function to get mods available for a specific base item
        function getModsForBase(baseItemKey) {
            const baseItem = mockBaseItems[baseItemKey];
            if (!baseItem) return [];

            const availableMods = [];
            const baseTags = baseItem.tags || [];

            Object.entries(mockMods).forEach(([modKey, modData]) => {
                // Check if this mod can spawn on this base
                const canSpawn = modData.spawn_weights.some(weight => 
                    baseTags.includes(weight.tag) && weight.weight > 0
                );

                if (canSpawn) {
                    availableMods.push({
                        key: modKey,
                        name: modData.name,
                        text: modData.text,
                        tiers: modData.tiers,
                        group: modData.group,
                        generation_type: modData.generation_type
                    });
                }
            });

            return availableMods;
        }

        // Function to get tier values for a mod
        function getTierValues(modKey, tier) {
            const mod = mockMods[modKey];
            if (!mod || !mod.tiers || !mod.tiers[tier]) return null;
            
            return mod.tiers[tier];
        }

        // Initialize the interface
        function initializeInterface() {
            // Populate base item suggestions
            const baseItemsList = document.getElementById('base-items-list');
            Object.entries(mockBaseItems).forEach(([key, item]) => {
                const option = document.createElement('option');
                option.value = item.display_name;
                option.setAttribute('data-key', key);
                baseItemsList.appendChild(option);
            });

            // Update mod suggestions when base item changes
            document.getElementById('base-item').addEventListener('input', updateModSuggestions);
        }

        function updateModSuggestions() {
            const baseItemName = document.getElementById('base-item').value;
            const baseItemKey = Object.keys(mockBaseItems).find(key => 
                mockBaseItems[key].display_name.toLowerCase() === baseItemName.toLowerCase()
            );

            const modSuggestions = document.getElementById('mod-suggestions');
            modSuggestions.innerHTML = '';

            if (baseItemKey) {
                const availableMods = getModsForBase(baseItemKey);
                availableMods.forEach(mod => {
                    const option = document.createElement('option');
                    option.value = mod.name;
                    option.setAttribute('data-key', mod.key);
                    modSuggestions.appendChild(option);
                });
            } else {
                // Show all mods if no specific base selected
                Object.entries(mockMods).forEach(([key, mod]) => {
                    const option = document.createElement('option');
                    option.value = mod.name;
                    option.setAttribute('data-key', key);
                    modSuggestions.appendChild(option);
                });
            }
        }

        let selectedMods = [];

        function addMod() {
            const modSearch = document.getElementById('mod-search').value;
            const selectedTier = document.getElementById('mod-tier').value;
            const minValue = document.getElementById('mod-min').value;
            const maxValue = document.getElementById('mod-max').value;

            if (!modSearch) {
                alert('Please enter a mod to search for');
                return;
            }

            // Find the mod key from the datalist
            const modOptions = document.getElementById('mod-suggestions').options;
            let modKey = null;
            for (let option of modOptions) {
                if (option.value === modSearch) {
                    modKey = option.getAttribute('data-key');
                    break;
                }
            }

            if (!modKey || !mockMods[modKey]) {
                alert('Mod not found. Please select from the suggestions.');
                return;
            }

            const modData = mockMods[modKey];
            let finalMin = null, finalMax = null;

            // If tier is selected, use tier values, otherwise use manual min/max
            if (selectedTier && modData.tiers && modData.tiers[selectedTier]) {
                const tierData = modData.tiers[selectedTier];
                finalMin = tierData.min;
                finalMax = tierData.max;
            } else if (minValue || maxValue) {
                finalMin = minValue ? parseInt(minValue) : null;
                finalMax = maxValue ? parseInt(maxValue) : null;
            }

            const mod = {
                key: modKey,
                name: modData.name,
                text: modData.text,
                tier: selectedTier,
                min: finalMin,
                max: finalMax,
                generation_type: modData.generation_type
            };

            selectedMods.push(mod);
            updateModList();
            
            // Clear inputs
            document.getElementById('mod-search').value = '';
            document.getElementById('mod-tier').value = '';
            document.getElementById('mod-min').value = '';
            document.getElementById('mod-max').value = '';
        }

        function removeMod(index) {
            selectedMods.splice(index, 1);
            updateModList();
        }

        function updateModList() {
            const modList = document.getElementById('mod-list');
            
            if (selectedMods.length === 0) {
                modList.style.display = 'none';
                return;
            }

            modList.style.display = 'block';
            modList.innerHTML = selectedMods.map((mod, index) => {
                let displayText = mod.name;
                if (mod.tier) {
                    displayText += ` [${mod.tier}]`;
                }
                if (mod.min !== null || mod.max !== null) {
                    const range = mod.min && mod.max ? `${mod.min}-${mod.max}` : 
                                 mod.min ? `${mod.min}+` : `up to ${mod.max}`;
                    displayText += ` (${range})`;
                }
                
                return `
                    <div class="mod-item">
                        <span>${displayText}</span>
                        <button class="remove-btn" onclick="removeMod(${index})">Remove</button>
                    </div>
                `;
            }).join('');
        }

        function generateTradeURL() {
            const league = document.getElementById('league').value;
            const baseItem = document.getElementById('base-item').value;
            const itemCategory = document.getElementById('item-category').value;
            const itemRarity = document.getElementById('item-rarity').value;
            const qualityMin = document.getElementById('quality-min').value;
            const qualityMax = document.getElementById('quality-max').value;
            const itemLevelMin = document.getElementById('item-level-min').value;
            const itemLevelMax = document.getElementById('item-level-max').value;
            
            // Checkboxes
            const corrupted = document.getElementById('corrupted').checked;
            const fractured = document.getElementById('fractured').checked;
            const synthesised = document.getElementById('synthesised').checked;
            const crafted = document.getElementById('crafted').checked;
            const veiled = document.getElementById('veiled').checked;
            const mirrored = document.getElementById('mirrored').checked;

            // Build the query object that matches PoE's trade API structure
            const query = {
                status: { option: "online" },
                stats: [],
                filters: {}
            };

            // Add base item type
            if (baseItem) {
                const baseKey = Object.keys(mockBaseItems).find(key => 
                    mockBaseItems[key].display_name.toLowerCase() === baseItem.toLowerCase()
                );
                if (baseKey) {
                    query.type = mockBaseItems[baseKey].name;
                }
            }

            // Type filters
            if (itemCategory || itemRarity) {
                query.filters.type_filters = { filters: {} };
                if (itemCategory) query.filters.type_filters.filters.category = { option: itemCategory };
                if (itemRarity) query.filters.type_filters.filters.rarity = { option: itemRarity };
            }

            // Misc filters
            const miscFilters = {};
            
            if (qualityMin || qualityMax) {
                miscFilters.quality = {};
                if (qualityMin) miscFilters.quality.min = parseInt(qualityMin);
                if (qualityMax) miscFilters.quality.max = parseInt(qualityMax);
            }

            if (itemLevelMin || itemLevelMax) {
                miscFilters.ilvl = {};
                if (itemLevelMin) miscFilters.ilvl.min = parseInt(itemLevelMin);
                if (itemLevelMax) miscFilters.ilvl.max = parseInt(itemLevelMax);
            }

            if (corrupted) miscFilters.corrupted = { option: "true" };
            if (fractured) miscFilters.fractured_item = { option: "true" };
            if (synthesised) miscFilters.synthesised_item = { option: "true" };
            if (crafted) miscFilters.crafted = { option: "true" };
            if (veiled) miscFilters.veiled = { option: "true" };
            if (mirrored) miscFilters.mirrored = { option: "true" };

            if (Object.keys(miscFilters).length > 0) {
                query.filters.misc_filters = { filters: miscFilters };
            }

            // Add stat filters (mods)
            if (selectedMods.length > 0) {
                const statFilters = selectedMods.map(mod => {
                    const filter = {
                        id: `explicit.${mod.key}`, // This would need proper mapping to PoE's stat IDs
                        value: {}
                    };
                    
                    if (mod.min !== null) filter.value.min = mod.min;
                    if (mod.max !== null) filter.value.max = mod.max;
                    
                    return filter;
                });

                query.stats = [{
                    type: "and",
                    filters: statFilters
                }];
            }

            // Generate the URL
            try {
                const encodedQuery = btoa(JSON.stringify(query));
                const tradeURL = `https://www.pathofexile.com/trade/search/${league}/${encodedQuery}`;

                // Display results
                document.getElementById('trade-url').textContent = tradeURL;
                document.getElementById('results').style.display = 'block';
                document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
            } catch (error) {
                alert('Error generating URL: ' + error.message);
            }
        }

        function copyToClipboard() {
            const url = document.getElementById('trade-url').textContent;
            navigator.clipboard.writeText(url).then(() => {
                alert('URL copied to clipboard!');
            });
        }

        function openInNewTab() {
            const url = document.getElementById('trade-url').textContent;
            window.open(url, '_blank');
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', initializeInterface);

        // Add enter key support for mod search
        document.getElementById('mod-search').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addMod();
            }
        });
    </script>
</body>
</html>
