<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoE Trade Helper - Abyss Jewels</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 400px;
            min-height: 500px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #e8e8e8;
            padding: 0;
            margin: 0;
        }

        .header {
            background: linear-gradient(45deg, #af6025 0%, #d4af37 50%, #af6025 100%);
            padding: 12px 16px;
            text-align: center;
            border-bottom: 2px solid #d4af37;
            box-shadow: 0 2px 8px rgba(212, 175, 55, 0.3);
        }

        .header h1 {
            font-size: 16px;
            font-weight: bold;
            color: #1a1a2e;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
            margin: 0;
        }

        .header .subtitle {
            font-size: 11px;
            color: #2a2a4e;
            margin-top: 2px;
            font-weight: 500;
        }

        .container {
            padding: 16px;
        }

        .section {
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 13px;
            font-weight: 600;
            color: #d4af37;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .jewel-selector {
            position: relative;
            margin-bottom: 12px;
        }

        .jewel-dropdown {
            width: 100%;
            padding: 10px 12px;
            background: rgba(26, 26, 46, 0.8);
            border: 2px solid #4a5568;
            border-radius: 6px;
            color: #e8e8e8;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .jewel-dropdown:hover {
            border-color: #d4af37;
            background: rgba(26, 26, 46, 0.95);
        }

        .jewel-dropdown:focus {
            outline: none;
            border-color: #d4af37;
            box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.2);
        }

        .search-mode {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .mode-btn {
            flex: 1;
            padding: 8px 12px;
            background: rgba(74, 85, 104, 0.5);
            border: 1px solid #4a5568;
            border-radius: 4px;
            color: #e8e8e8;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .mode-btn:hover {
            background: rgba(74, 85, 104, 0.8);
            border-color: #d4af37;
        }

        .mode-btn.active {
            background: linear-gradient(45deg, #af6025, #d4af37);
            border-color: #d4af37;
            color: #1a1a2e;
            font-weight: 600;
        }

        .mod-search-section {
            display: none;
        }

        .mod-search-section.active {
            display: block;
        }

        .search-input-container {
            position: relative;
            margin-bottom: 12px;
        }

        .search-input {
            width: 100%;
            padding: 10px 12px;
            background: rgba(26, 26, 46, 0.8);
            border: 2px solid #4a5568;
            border-radius: 6px;
            color: #e8e8e8;
            font-size: 13px;
            transition: all 0.2s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: #d4af37;
            box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.2);
        }

        .search-input::placeholder {
            color: #a0aec0;
        }

        .suggestions-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: rgba(26, 26, 46, 0.95);
            border: 2px solid #4a5568;
            border-top: none;
            border-radius: 0 0 6px 6px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
        }

        .suggestion-item {
            padding: 8px 12px;
            cursor: pointer;
            border-bottom: 1px solid rgba(74, 85, 104, 0.3);
            transition: background-color 0.1s ease;
        }

        .suggestion-item:hover,
        .suggestion-item.highlighted {
            background: rgba(212, 175, 55, 0.2);
        }

        .suggestion-item:last-child {
            border-bottom: none;
        }

        .suggestion-text {
            font-size: 12px;
            color: #e8e8e8;
        }

        .suggestion-confidence {
            font-size: 10px;
            color: #d4af37;
            font-weight: 500;
        }

        .selected-mods {
            margin-bottom: 16px;
        }

        .selected-mod {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 4px;
            padding: 8px 10px;
            margin-bottom: 6px;
            font-size: 11px;
        }

        .selected-mod-info {
            flex: 1;
        }

        .selected-mod-text {
            color: #e8e8e8;
            font-weight: 500;
            display: block;
            margin-bottom: 2px;
        }

        .selected-mod-tiers {
            color: #d4af37;
            font-size: 10px;
        }

        .tier-range {
            background: rgba(212, 175, 55, 0.2);
            padding: 2px 6px;
            border-radius: 3px;
        }

        .remove-mod {
            background: none;
            border: none;
            color: #e53e3e;
            cursor: pointer;
            font-size: 16px;
            padding: 0;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 2px;
            transition: background-color 0.2s ease;
        }

        .remove-mod:hover {
            color: #ff6b6b;
            background: rgba(229, 62, 62, 0.1);
        }

        .search-button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(45deg, #af6025, #d4af37);
            border: none;
            border-radius: 6px;
            color: #1a1a2e;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .search-button:hover {
            background: linear-gradient(45deg, #d4af37, #af6025);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
        }

        .search-button:active {
            transform: translateY(0);
        }

        .search-button:disabled {
            background: rgba(74, 85, 104, 0.5);
            color: #a0aec0;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .status-message {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 4px;
            padding: 8px 12px;
            margin-bottom: 16px;
            font-size: 12px;
            color: #d4af37;
            text-align: center;
        }

        .status-message.success {
            background: rgba(72, 187, 120, 0.1);
            border-color: rgba(72, 187, 120, 0.3);
            color: #48bb78;
        }

        .status-message.error {
            background: rgba(229, 62, 62, 0.1);
            border-color: rgba(229, 62, 62, 0.3);
            color: #e53e3e;
        }

        .debug-info {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid #ff6b6b;
            border-radius: 4px;
            padding: 8px;
            margin-bottom: 16px;
            font-size: 11px;
            color: #ff6b6b;
        }

        .debug-info h4 {
            margin-bottom: 4px;
            color: #ff6b6b;
        }

        .debug-info pre {
            color: #e8e8e8;
            font-size: 10px;
            margin: 4px 0;
            white-space: pre-wrap;
        }

        /* Tier Selection Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border: 2px solid #d4af37;
            border-radius: 8px;
            padding: 20px;
            max-width: 300px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-title {
            color: #d4af37;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 16px;
            text-align: center;
        }

        .tier-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(60px, 1fr));
            gap: 8px;
            margin-bottom: 20px;
        }

        .tier-option {
            padding: 8px 6px;
            background: rgba(74, 85, 104, 0.3);
            border: 1px solid #4a5568;
            border-radius: 4px;
            color: #e8e8e8;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            font-size: 11px;
        }

        .tier-option:hover {
            background: rgba(212, 175, 55, 0.2);
            border-color: #d4af37;
        }

        .tier-option.selected {
            background: rgba(212, 175, 55, 0.4);
            border-color: #d4af37;
            color: #1a1a2e;
            font-weight: 600;
        }

        .tier-values {
            font-size: 9px;
            color: #a0aec0;
            margin-top: 2px;
        }

        .tier-option.selected .tier-values {
            color: #2a2a4e;
        }

        .modal-buttons {
            display: flex;
            gap: 8px;
        }

        .modal-btn {
            flex: 1;
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .modal-btn.confirm {
            background: linear-gradient(45deg, #af6025, #d4af37);
            color: #1a1a2e;
            font-weight: 600;
        }

        .modal-btn.confirm:hover {
            background: linear-gradient(45deg, #d4af37, #af6025);
        }

        .modal-btn.confirm:disabled {
            background: rgba(74, 85, 104, 0.5);
            color: #a0aec0;
            cursor: not-allowed;
        }

        .modal-btn.cancel {
            background: rgba(74, 85, 104, 0.5);
            color: #e8e8e8;
        }

        .modal-btn.cancel:hover {
            background: rgba(74, 85, 104, 0.8);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>PoE Trade Helper</h1>
        <div class="subtitle">Abyss Jewels Edition</div>
    </div>

    <div class="container">
        <!-- Status Message -->
        <div id="statusMessage" class="status-message" style="display: none;"></div>

        <!-- Debug Info Section -->
        <div class="debug-info">
            <h4>Debug Information:</h4>
            <div id="debug-log">Initializing...</div>
        </div>

        <!-- Jewel Selection -->
        <div class="section">
            <div class="section-title">Select Abyss Jewel Type</div>
            <div class="jewel-selector">
                <select id="jewelTypeSelect" class="jewel-dropdown">
                    <option value="">Choose a jewel type...</option>
                    <option value="Metadata/Items/Jewels/JewelAbyssMelee">Murderous Eye Jewel (Melee)</option>
                    <option value="Metadata/Items/Jewels/JewelAbyssRanged">Searching Eye Jewel (Ranged)</option>
                    <option value="Metadata/Items/Jewels/JewelAbyssCaster">Hypnotic Eye Jewel (Caster)</option>
                    <option value="Metadata/Items/Jewels/JewelAbyssSummoner">Ghastly Eye Jewel (Summoner)</option>
                </select>
            </div>
        </div>

        <!-- Search Mode Selection -->
        <div class="section">
            <div class="section-title">Search Mode</div>
            <div class="search-mode">
                <button id="baseModeBtn" class="mode-btn active">Base Items Only</button>
                <button id="modModeBtn" class="mode-btn">With Specific Mods</button>
            </div>
        </div>

        <!-- Mod Search Section -->
        <div id="modSearchSection" class="mod-search-section">
            <div class="section">
                <div class="section-title">Search for Mods</div>
                <div class="search-input-container">
                    <input 
                        type="text" 
                        id="modSearchInput" 
                        class="search-input" 
                        placeholder="Type mod name (e.g., 'life', 'es', 'fire res')..."
                        autocomplete="off"
                    >
                    <div id="suggestionsDropdown" class="suggestions-dropdown"></div>
                </div>
                
                <div id="selectedMods" class="selected-mods"></div>
            </div>
        </div>

        <!-- Search Button -->
        <div class="section">
            <button id="searchButton" class="search-button" disabled>
                Select Jewel Type First
            </button>
        </div>
    </div>

    <!-- Tier Selection Modal -->
    <div id="tierModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-title" id="modalTitle">Select Tier</div>
            <div id="tierOptions" class="tier-options"></div>
            <div class="modal-buttons">
                <button class="modal-btn cancel" onclick="closeTierModal()">Cancel</button>
                <button class="modal-btn confirm" id="confirmTierBtn" onclick="confirmTierSelection()" disabled>
                    Add Mod
                </button>
            </div>
        </div>
    </div>

    <!-- Load the external JavaScript file -->
    <script src="popup.js"></script>
</body>
</html>
