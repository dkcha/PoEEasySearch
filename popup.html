<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoE Easy Search</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Fixed dimensions to prevent layout shifts */
        body {
            width: 420px;
            height: 600px;
            min-height: 600px;
            max-height: 600px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #ffffff;
            font-size: 13px;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(90deg, #0f3460 0%, #e94560 100%);
            padding: 16px;
            text-align: center;
            box-shadow: 0 2px 10px rgba(233, 69, 96, 0.3);
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .header .subtitle {
            font-size: 11px;
            opacity: 0.9;
        }

        .container {
            padding: 16px;
            height: calc(100vh - 80px);
            overflow-y: auto;
        }

        /* Search Type Selection */
        .search-type {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 16px;
        }

        .search-type h3 {
            font-size: 14px;
            margin-bottom: 8px;
            color: #e94560;
        }

        .radio-group {
            display: flex;
            gap: 16px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .radio-option input[type="radio"] {
            accent-color: #e94560;
        }

        .radio-option label {
            cursor: pointer;
            font-size: 12px;
        }

        /* Animations - Simplified for stability */
        .section {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            margin-bottom: 12px;
            overflow: hidden;
        }

        .section.collapsed .section-content {
            display: none;
        }

        .collapsible-header {
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.08);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 500;
        }

        .collapsible-header:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .collapsible-header::after {
            content: '▼';
            font-size: 10px;
        }

        .section.collapsed .collapsible-header::after {
            content: '▶';
        }

        .section-content {
            padding: 16px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .form-group label {
            display: block;
            margin-bottom: 4px;
            font-weight: 500;
            font-size: 12px;
            color: #b8c6db;
        }

        .form-group select,
        .form-group input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            font-size: 12px;
        }

        .form-group select:focus,
        .form-group input:focus {
            outline: none;
            border-color: #e94560;
            box-shadow: 0 0 0 1px rgba(233, 69, 96, 0.3);
        }

        .form-group select option {
            background: #1a1a2e;
            color: #ffffff;
        }

        .input-group {
            display: flex;
            gap: 8px;
        }

        .input-group input {
            flex: 1;
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 8px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .checkbox-item input[type="checkbox"] {
            width: auto;
            accent-color: #e94560;
        }

        .checkbox-item label {
            margin: 0;
            cursor: pointer;
            font-size: 12px;
        }

        /* Mod Management */
        .mod-controls {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .mod-controls button {
            flex: 1;
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
        }

        .btn-primary {
            background: #e94560;
            color: white;
        }

        .btn-primary:hover {
            background: #d63384;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #b8c6db;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .mod-row {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
            padding: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }

        .mod-row.template {
            display: none;
        }

        .mod-select {
            flex: 2;
        }

        .tier-select {
            flex: 1;
        }

        .remove-mod {
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 6px 8px;
            cursor: pointer;
            font-size: 11px;
        }

        .remove-mod:hover {
            background: #c82333;
        }

        /* Action Buttons */
        .actions {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .action-buttons button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
        }

        .btn-search {
            background: linear-gradient(45deg, #e94560, #f27121);
            color: white;
            font-size: 14px;
        }

        .btn-search:hover {
            box-shadow: 0 2px 8px rgba(233, 69, 96, 0.3);
        }

        .btn-reset {
            background: rgba(255, 255, 255, 0.1);
            color: #b8c6db;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-reset:hover {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        /* Status Bar */
        .status {
            margin-top: 12px;
            padding: 8px 12px;
            background: rgba(15, 52, 96, 0.3);
            border: 1px solid rgba(15, 52, 96, 0.5);
            border-radius: 4px;
            font-size: 11px;
            text-align: center;
            color: #b8c6db;
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            body {
                width: 100vw;
            }
            
            .checkbox-group {
                grid-template-columns: 1fr;
            }
            
            .input-group {
                flex-direction: column;
            }
            
            .action-buttons {
                flex-direction: column;
            }
        }

        /* Scrollbar Styling */
        .container::-webkit-scrollbar {
            width: 6px;
        }

        .container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
        }

        .container::-webkit-scrollbar-thumb {
            background: rgba(233, 69, 96, 0.5);
            border-radius: 3px;
        }

        .container::-webkit-scrollbar-thumb:hover {
            background: rgba(233, 69, 96, 0.7);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>PoE Easy Search</h1>
        <div class="subtitle">Streamlined Path of Exile Trading</div>
    </div>

    <div class="container">
        <!-- Search Type Selection -->
        <div class="search-type">
            <h3>Search Type</h3>
            <div class="radio-group">
                <div class="radio-option">
                    <input type="radio" id="searchBaseOnly" name="searchType" value="baseOnly" checked>
                    <label for="searchBaseOnly">Base Items Only</label>
                </div>
                <div class="radio-option">
                    <input type="radio" id="searchWithMods" name="searchType" value="withMods">
                    <label for="searchWithMods">With Specific Mods</label>
                </div>
            </div>
        </div>

        <!-- Base Item Section -->
        <div class="section">
            <div class="collapsible-header">Base Item</div>
            <div class="section-content">
                <div class="form-group">
                    <label for="baseItem">Item Type</label>
                    <select id="baseItem">
                        <option value="">Loading items...</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Item Properties Section -->
        <div class="section">
            <div class="collapsible-header">Item Properties</div>
            <div class="section-content">
                <div class="form-group">
                    <label>Item Level</label>
                    <div class="input-group">
                        <input type="number" id="itemLevelMin" placeholder="Min" min="1" max="100">
                        <input type="number" id="itemLevelMax" placeholder="Max" min="1" max="100">
                    </div>
                </div>

                <div class="form-group">
                    <label>Quality</label>
                    <div class="input-group">
                        <input type="number" id="qualityMin" placeholder="Min %" min="0" max="30">
                        <input type="number" id="qualityMax" placeholder="Max %" min="0" max="30">
                    </div>
                </div>

                <div class="form-group">
                    <label>Special Properties</label>
                    <div class="checkbox-group">
                        <div class="checkbox-item">
                            <input type="checkbox" id="corrupted">
                            <label for="corrupted">Corrupted</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="fractured">
                            <label for="fractured">Fractured</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="synthesised">
                            <label for="synthesised">Synthesised</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Mods Section (Hidden for base-only searches) -->
        <div class="section mods">
            <div class="collapsible-header">Mods & Affixes</div>
            <div class="section-content">
                <div class="mod-controls">
                    <button id="addMod" class="btn-primary">Add Mod</button>
                    <button id="clearMods" class="btn-secondary">Clear All</button>
                </div>

                <div id="modContainer">
                    <div class="mod-row template">
                        <select class="mod-select">
                            <option value="">Select mod...</option>
                        </select>
                        <select class="tier-select">
                            <option value="">Select tier...</option>
                        </select>
                        <button class="remove-mod">×</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Price Section -->
        <div class="section">
            <div class="collapsible-header">Price Range</div>
            <div class="section-content">
                <div class="form-group">
                    <label>Price</label>
                    <div class="form-row">
                        <input type="number" id="priceMin" placeholder="Min" min="0" step="0.1">
                        <input type="number" id="priceMax" placeholder="Max" min="0" step="0.1">
                        <select id="priceCurrency">
                            <option value="chaos">Chaos</option>
                            <option value="divine">Divine</option>
                            <option value="exalted">Exalted</option>
                            <option value="mirror">Mirror</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- Actions -->
        <div class="actions">
            <div class="action-buttons">
                <button id="searchTrade" class="btn-search">Search Base Items</button>
                <button id="resetConfig" class="btn-reset">Reset</button>
            </div>
            <div id="status" class="status">🔄 Loading data...</div>
        </div>
    </div>

    <script src="data-processor.js"></script>
    <script src="popup.js"></script>
</body>
</html>
