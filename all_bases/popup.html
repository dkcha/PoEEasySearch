<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoE Trade Helper</title>
    <style>
        /* Reset and base styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 420px;
            height: 600px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 14px;
            background: linear-gradient(135deg, #2c1810 0%, #1a0f08 100%);
            color: #d4af37;
            padding: 16px;
            overflow-y: auto;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #8b4513;
            padding-bottom: 12px;
        }

        .header h1 {
            font-size: 18px;
            color: #d4af37;
            font-weight: 600;
        }

        .header p {
            font-size: 12px;
            color: #b8860b;
            margin-top: 4px;
        }

        /* Search type toggle */
        .search-type-section {
            margin-bottom: 16px;
            padding: 12px;
            background: rgba(139, 69, 19, 0.2);
            border-radius: 6px;
            border: 1px solid #8b4513;
        }

        .search-type-label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #d4af37;
        }

        .radio-group {
            display: flex;
            gap: 16px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .radio-option input[type="radio"] {
            margin: 0;
        }

        .radio-option label {
            cursor: pointer;
            color: #b8860b;
        }

        /* Form sections */
        .form-section {
            margin-bottom: 16px;
            padding: 12px;
            background: rgba(139, 69, 19, 0.15);
            border-radius: 6px;
            border: 1px solid rgba(139, 69, 19, 0.3);
        }

        .section-title {
            font-weight: 600;
            margin-bottom: 12px;
            color: #d4af37;
            font-size: 14px;
        }

        /* Form inputs */
        .form-group {
            margin-bottom: 12px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            margin-bottom: 4px;
            font-weight: 500;
            color: #b8860b;
            font-size: 12px;
        }

        input, select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #8b4513;
            border-radius: 4px;
            background: rgba(26, 15, 8, 0.8);
            color: #d4af37;
            font-size: 13px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #d4af37;
            box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.2);
        }

        input:disabled {
            background: rgba(26, 15, 8, 0.4);
            color: #666;
            cursor: not-allowed;
        }

        /* Range inputs */
        .range-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .range-group input {
            flex: 1;
        }

        .range-separator {
            color: #8b4513;
            font-weight: bold;
        }

        /* Mod search specific styles */
        .mod-search-container {
            position: relative;
        }

        #mod-search-input {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #8b4513;
            border-radius: 6px;
            background: rgba(26, 15, 8, 0.9);
            color: #d4af37;
            font-size: 14px;
            transition: border-color 0.2s ease;
        }

        #mod-search-input:focus {
            border-color: #d4af37;
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
        }

        /* Mod suggestions dropdown */
        .mod-suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: rgba(26, 15, 8, 0.95);
            border: 1px solid #8b4513;
            border-top: none;
            border-radius: 0 0 6px 6px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
        }

        .mod-suggestion {
            padding: 10px 12px;
            cursor: pointer;
            border-bottom: 1px solid rgba(139, 69, 19, 0.3);
            transition: background-color 0.15s ease;
        }

        .mod-suggestion:hover,
        .mod-suggestion.selected {
            background: rgba(139, 69, 19, 0.3);
        }

        .mod-suggestion:last-child {
            border-bottom: none;
        }

        .mod-name {
            color: #d4af37;
            font-weight: 500;
            margin-bottom: 2px;
        }

        .mod-meta {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
        }

        .match-score {
            font-weight: 600;
        }

        .mod-type {
            color: #8b4513;
            text-transform: uppercase;
        }

        .no-suggestions {
            padding: 12px;
            text-align: center;
            color: #8b4513;
            font-style: italic;
        }

        /* Selected mods display */
        .selected-mods {
            margin-top: 16px;
            padding: 12px;
            background: rgba(139, 69, 19, 0.1);
            border-radius: 6px;
            border: 1px solid rgba(139, 69, 19, 0.2);
        }

        .selected-mods-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .selected-mods-header h4 {
            color: #d4af37;
            font-size: 13px;
        }

        .clear-all-mods {
            background: rgba(220, 53, 69, 0.8);
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 11px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .clear-all-mods:hover {
            background: rgba(220, 53, 69, 1);
        }

        .selected-mod {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            background: rgba(26, 15, 8, 0.6);
            border-radius: 4px;
            margin-bottom: 6px;
            border: 1px solid rgba(139, 69, 19, 0.3);
        }

        .selected-mod:last-child {
            margin-bottom: 0;
        }

        .mod-info {
            flex: 1;
        }

        .mod-info .mod-name {
            color: #d4af37;
            font-weight: 500;
            font-size: 12px;
        }

        .mod-info .mod-tier {
            color: #b8860b;
            font-size: 11px;
            margin-top: 2px;
        }

        .remove-mod {
            background: rgba(220, 53, 69, 0.8);
            color: white;
            border: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s ease;
        }

        .remove-mod:hover {
            background: rgba(220, 53, 69, 1);
        }

        /* Tier selection modal */
        .tier-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .tier-modal-content {
            background: linear-gradient(135deg, #2c1810 0%, #1a0f08 100%);
            border: 2px solid #8b4513;
            border-radius: 8px;
            padding: 20px;
            max-width: 350px;
            width: 90%;
            max-height: 400px;
            overflow-y: auto;
        }

        .tier-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid #8b4513;
        }

        .tier-modal-header h4 {
            color: #d4af37;
            font-size: 14px;
            margin: 0;
        }

        .close-tier-modal {
            background: none;
            border: none;
            color: #8b4513;
            font-size: 20px;
            cursor: pointer;
            padding: 0;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-tier-modal:hover {
            color: #d4af37;
        }

        .tier-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .tier-option {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: rgba(139, 69, 19, 0.2);
            border: 1px solid rgba(139, 69, 19, 0.4);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tier-option:hover {
            background: rgba(139, 69, 19, 0.4);
            border-color: #d4af37;
        }

        .tier-name {
            color: #d4af37;
            font-weight: 600;
        }

        .tier-values {
            color: #b8860b;
            font-size: 12px;
        }

        /* Search buttons */
        .search-buttons {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .search-button {
            width: 100%;
            padding: 12px 16px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .search-button.primary {
            background: linear-gradient(135deg, #d4af37 0%, #b8860b 100%);
            color: #1a0f08;
        }

        .search-button.primary:hover {
            background: linear-gradient(135deg, #e6c547 0%, #c99a1b 100%);
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(212, 175, 55, 0.3);
        }

        .search-button:disabled {
            background: #666;
            color: #999;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Error messages */
        .error-message {
            background: rgba(220, 53, 69, 0.9);
            color: white;
            padding: 10px 12px;
            border-radius: 4px;
            margin-bottom: 16px;
            font-size: 13px;
            display: none;
            border: 1px solid rgba(220, 53, 69, 1);
        }

        /* Collapsible sections */
        .collapsible-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            padding: 8px 0;
        }

        .collapsible-icon {
            transition: transform 0.2s ease;
            color: #8b4513;
        }

        .collapsible-header.expanded .collapsible-icon {
            transform: rotate(180deg);
        }

        .collapsible-content {
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .collapsible-content.collapsed {
            max-height: 0;
        }

        .collapsible-content.expanded {
            max-height: 500px;
        }

        /* Responsive adjustments */
        @media (max-height: 500px) {
            body {
                height: auto;
                min-height: 500px;
            }
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(139, 69, 19, 0.1);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(139, 69, 19, 0.5);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(139, 69, 19, 0.7);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>PoE Trade Helper</h1>
        <p>Enhanced with Fuzzy Mod Matching</p>
    </div>

    <!-- Search Type Selection -->
    <div class="search-type-section">
        <label class="search-type-label">Search Type:</label>
        <div class="radio-group">
            <div class="radio-option">
                <input type="radio" id="search-base-only" name="search-type" value="base-only" checked>
                <label for="search-base-only">Base Items Only</label>
            </div>
            <div class="radio-option">
                <input type="radio" id="search-with-mods" name="search-type" value="with-mods">
                <label for="search-with-mods">With Specific Mods</label>
            </div>
        </div>
    </div>

    <!-- Base Item Selection -->
    <div class="form-section">
        <div class="section-title">Base Item</div>
        <div class="form-group">
            <label for="base-item-select">Select Base Item:</label>
            <select id="base-item-select">
                <option value="">Loading base items...</option>
            </select>
        </div>
    </div>

    <!-- Mod Search Section (Hidden by default) -->
    <div id="mod-section" class="form-section" style="display: none;">
        <div class="section-title">Mod Search</div>
        <div class="form-group">
            <label for="mod-search-input">Search for Mods:</label>
            <div class="mod-search-container">
                <input 
                    type="text" 
                    id="mod-search-input" 
                    placeholder="Select a base item first"
                    disabled
                >
                <!-- Mod suggestions will be dynamically inserted here -->
            </div>
        </div>
        <!-- Selected mods will be dynamically inserted here -->
    </div>

    <!-- Item Properties -->
    <div class="form-section">
        <div class="collapsible-header" onclick="toggleSection('item-properties')">
            <div class="section-title">Item Properties</div>
            <span class="collapsible-icon">▼</span>
        </div>
        <div id="item-properties" class="collapsible-content expanded">
            <div class="form-group">
                <label>Item Level:</label>
                <div class="range-group">
                    <input type="number" id="min-level" placeholder="Min" min="1" max="100">
                    <span class="range-separator">to</span>
                    <input type="number" id="max-level" placeholder="Max" min="1" max="100">
                </div>
            </div>
            <div class="form-group">
                <label>Quality:</label>
                <div class="range-group">
                    <input type="number" id="min-quality" placeholder="Min %" min="0" max="30">
                    <span class="range-separator">to</span>
                    <input type="number" id="max-quality" placeholder="Max %" min="0" max="30">
                </div>
            </div>
            <div class="form-group">
                <label for="corrupted-select">Corrupted:</label>
                <select id="corrupted-select">
                    <option value="any">Any</option>
                    <option value="yes">Yes</option>
                    <option value="no">No</option>
                </select>
            </div>
            <div class="form-group">
                <label for="fractured-select">Fractured:</label>
                <select id="fractured-select">
                    <option value="any">Any</option>
                    <option value="yes">Yes</option>
                    <option value="no">No</option>
                </select>
            </div>
            <div class="form-group">
                <label for="synthesised-select">Synthesised:</label>
                <select id="synthesised-select">
                    <option value="any">Any</option>
                    <option value="yes">Yes</option>
                    <option value="no">No</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Price Range -->
    <div class="form-section">
        <div class="collapsible-header" onclick="toggleSection('price-range')">
            <div class="section-title">Price Range</div>
            <span class="collapsible-icon">▼</span>
        </div>
        <div id="price-range" class="collapsible-content collapsed">
            <div class="form-group">
                <label>Price (Chaos Orbs):</label>
                <div class="range-group">
                    <input type="number" id="min-price" placeholder="Min" min="0" step="0.1">
                    <span class="range-separator">to</span>
                    <input type="number" id="max-price" placeholder="Max" min="0" step="0.1">
                </div>
            </div>
        </div>
    </div>

    <!-- Search Buttons -->
    <div id="search-buttons" class="search-buttons">
        <button id="search-base-button" class="search-button primary">
            Search Base Items
        </button>
    </div>

    <!-- Scripts -->
    <script src="data-processor.js"></script>
    <script src="popup.js"></script>

    <script>
        // Collapsible section toggle function
        function toggleSection(sectionId) {
            const content = document.getElementById(sectionId);
            const header = content.previousElementSibling;
            const icon = header.querySelector('.collapsible-icon');
            
            if (content.classList.contains('collapsed')) {
                content.classList.remove('collapsed');
                content.classList.add('expanded');
                header.classList.add('expanded');
            } else {
                content.classList.remove('expanded');
                content.classList.add('collapsed');
                header.classList.remove('expanded');
            }
        }

        // Initialize collapsible sections
        document.addEventListener('DOMContentLoaded', () => {
            // Set initial states
            const priceSection = document.getElementById('price-range');
            const itemPropsSection = document.getElementById('item-properties');
            
            // Price section starts collapsed
            priceSection.classList.add('collapsed');
            
            // Item properties section starts expanded
            itemPropsSection.classList.add('expanded');
            itemPropsSection.previousElementSibling.classList.add('expanded');
        });
    </script>
</body>
</html>
